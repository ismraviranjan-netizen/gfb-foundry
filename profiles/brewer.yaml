# A global brewer's European operating company. Same core, different data.
company: Northern Brewing OpCo (fictional)
archetype: global_brewer_opco
currency: EUR
bucket: week
horizon_weeks: 13

kpis:
  otif_target: 0.98                # retailers fine on OTIF; the bar is higher
  otif_warn: 0.96
  sku_otif_warn: 0.90
  fill_rate_target: 0.985
  min_dos_days: 10                 # kegs and bottles move slower; longer cover is normal
  max_dos_days: 35
  z_alert: 2.0
  baseline_weeks: 13

diagnosis:
  demand_spike_pct: 0.15           # football weekends and heatwaves are planned; 15% over plan is a spike
  late_truck_share: 0.25
  late_truck_days: 0.5             # retailer slots are booked to the hour
  dock_dwell_factor: 1.5
  supply_short_pct: 0.10
  max_snapshot_age_h: 12

triage:
  classes:
    P1: {max_dos_days: 4, min_impact_inr: 50000, sla_hours: 2}
    P2: {max_dos_days: 10, min_impact_inr: 10000, sla_hours: 12}
    P3: {sla_hours: 48}
  penalty_per_late_case_inr: 3.5   # in EUR here: retailer penalty per late case

approvers:
  inter_dc_transfer: opco_planner
  expedite_alternate_carrier: transport_manager
  reschedule_dock_slots: site_manager
  extend_shift: site_manager
  raise_production_lot: brewery_planner
  expedite_plant_run: brewery_planner
  allocate_fair_share: opco_planner
  promo_cap: commercial_lead
  inform_customers: key_account_manager
  refresh_snapshot: data_lead
  no_operational_action: data_lead
  book_truck: transport_manager
  co_sign_transfer: site_manager
  adjust_forecast: demand_planner
  co_sign_forecast: sop_lead
  escalate: supply_chain_director

people:
  opco_planner: Lotte de Vries
  transport_manager: Marek Nowak
  site_manager: {ANY: Sven Halvorsen}
  brewery_planner: Ines Fischer
  commercial_lead: Tom Brennan
  key_account_manager: Aisha Khan
  demand_planner: Pieter Jansen
  sop_lead: Camille Roux
  data_lead: Noor Haddad
  supply_chain_director: Henrik Dahl

rebalance:
  target_cover_days: 21
  min_transfer_cases: 300            # a keg truck is a bigger commitment
  arrival_tolerance_days: 0          # retailer slots do not wait
  sender_floor: rop
  fresh_only: true

sensing:
  history_weeks: 13
  alphas: [0.2, 0.35, 0.5]
  holdout_weeks: 8
  min_adjustment_pct: 0.03
  min_improvement_pct: 0.10
  min_win_share: 0.6
  confirm_weeks: 1                   # heatwaves do not repeat before they matter
  cosign_above_pct: 0.20

queue:
  group_dc_level_causes: [DOCK_CONGESTION, DATA_STALE]
  escalation: {P1: [escalate], P2: [escalate], P3: []}
  reminder_at_pct: 0.5
  digest_hour: 6

risk:
  horizon_days: 21
  reliability_floor: 0.9
  pre_empt_min_inr: 30000
  plant_receipt_day: 3
  history_weeks: 4
  red_min_share_of_day: 0.1          # retailer slots do not forgive a small shortage

tower:
  monday_run_hour_ist: 6.0
  replan_on_eta_change_days: 0.5
  notify_channels: [email, sms]
